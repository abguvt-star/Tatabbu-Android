name: Build Abdullah Life Native APK
on:
  push:
    branches: [abdullah-life-unified]
    paths:
      - 'life/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-life.yml'
  workflow_dispatch:
concurrency:
  group: abdullah-life-apk-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android APK
        run: gradle --no-daemon :life:assembleDebug
      - name: Verify APK ZIP, package identity, version and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="life/build/outputs/apk/debug/life-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -Fq "package: name='com.abdullah.life'" apk-badging.txt
          grep -Fq "versionName='0.1.1'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          sha256sum "$apk" | tee apk-build.sha256
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Abdullah-Life-native-debug
          path: life/build/outputs/apk/debug/life-debug.apk
          if-no-files-found: error
      - name: Publish verified APK with safe Git retry
        shell: bash
        run: |
          set -euo pipefail
          cp life/build/outputs/apk/debug/life-debug.apk "$RUNNER_TEMP/life-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin abdullah-life-unified
            git reset --hard origin/abdullah-life-unified
            mkdir -p dist
            cp "$RUNNER_TEMP/life-debug.apk" dist/abdullah-life.apk
            cd dist
            sha256sum abdullah-life.apk > abdullah-life.apk.sha256
            printf '%s\n' "Package: com.abdullah.life" "Version: 0.1.1 (2)" "File: abdullah-life.apk" "Build: Android Native (debug signed)" > BUILD-INFO.txt
            cd ..
            git add dist/abdullah-life.apk dist/abdullah-life.apk.sha256 dist/BUILD-INFO.txt
            if git diff --cached --quiet; then
              echo "The verified APK is already published."
              exit 0
            fi
            git commit -m "Publish verified عبدالله Life APK v0.1.1"
            if git push origin HEAD:abdullah-life-unified; then
              echo "Verified APK published."
              exit 0
            fi
            sleep 2
          done
          echo "APK publishing failed after retries"
          exit 1
