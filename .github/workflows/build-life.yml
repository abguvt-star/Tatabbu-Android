name: Build Abdullah Life Native APK
on:
  push:
    branches: [abdullah-life-unified]
    paths:
      - 'life/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-life.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android APK
        run: gradle --no-daemon :life:assembleDebug
      - name: Check APK
        run: |
          test -s life/build/outputs/apk/debug/life-debug.apk
          unzip -t life/build/outputs/apk/debug/life-debug.apk | tail -1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Abdullah-Life-native-debug
          path: life/build/outputs/apk/debug/life-debug.apk
          if-no-files-found: error
      - name: Publish direct APK within feature branch
        run: |
          mkdir -p dist
          cp life/build/outputs/apk/debug/life-debug.apk dist/abdullah-life.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/abdullah-life.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish عبدالله حياة build"
            git push origin HEAD:abdullah-life-unified
          fi
