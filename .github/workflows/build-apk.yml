name: Build Tatabbu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source package
        shell: bash
        run: |
          if [ -f tatabbu-source.tar.xz.b64 ]; then
            base64 --decode tatabbu-source.tar.xz.b64 > tatabbu-source.tar.xz
            echo "3f239d5193827732ec86cf8b77c776730e3e98bbe584d0b1a1d40d89fc96a037  tatabbu-source.tar.xz" | sha256sum --check
            tar -xJf tatabbu-source.tar.xz
            rm -f tatabbu-source.tar.xz.b64 tatabbu-source.tar.xz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Add native Android source files"
              git push origin HEAD:main
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tatabbu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
