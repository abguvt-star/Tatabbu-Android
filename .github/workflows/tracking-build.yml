name: Build Idarat AlTatabbu APK
on:
  push:
    branches:
      - feature/idarat-al-tatabbu-2026
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack independent project
        run: base64 -d tracking_android_src.b64 | tar -xJf -
      - name: Verify and build Android
        working-directory: IdaratAlTatabbu
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IdaratAlTatabbu-debug-apk
          path: IdaratAlTatabbu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
